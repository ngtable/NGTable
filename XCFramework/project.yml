# XcodeGen spec of the NGTable framework, built from the package's own sources
# into the binary XCFramework that customers link. Generated by
# build-xcframework.sh; the generated NGTable.xcodeproj isn't committed.
name: NGTable
options:
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
targets:
  NGTable:
    type: framework
    platform: macOS
    sources:
      - path: ../Sources/NGTable
        excludes:
          - "NGTable.docc"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.digitalglobe.NGTable
        GENERATE_INFOPLIST_FILE: YES
        # MARKETING_VERSION: NGTableView.version, set by build-xcframework.sh.
        CURRENT_PROJECT_VERSION: "1"
        # A module interface (.swiftinterface) that later compilers can read.
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        # The strings are looked up with `bundle: .module` (NGTableBundle.swift).
        SWIFT_EMIT_LOC_STRINGS: NO
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
