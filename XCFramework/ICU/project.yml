# XcodeGen spec of the NGTableICU framework, built from the package's sources
# into the binary XCFramework customers add next to NGTable.xcframework. It
# links the binary NGTable (not a copy of it) and carries the ICU inside.
# Generated by build-xcframework.sh; the generated project isn't committed.
name: NGTableICU
options:
  createIntermediateGroups: true
settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
packages:
  # swift-foundation-icu's ICU 76.1 with only collation's data, as in
  # Package.swift.
  CollationICU:
    path: ../../Vendor/CollationICU
targets:
  NGTableICU:
    type: framework
    platform: macOS
    sources:
      - path: ../../Sources/NGTableICU
    dependencies:
      - package: CollationICU
        product: _NGCollationICU
      - framework: build/NGTable.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.digitalglobe.NGTableICU
        GENERATE_INFOPLIST_FILE: YES
        # MARKETING_VERSION: NGTable's, set by build-xcframework.sh.
        CURRENT_PROJECT_VERSION: "1"
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        SKIP_INSTALL: NO
        DEFINES_MODULE: YES
        ARCHS: "arm64 x86_64"
        ONLY_ACTIVE_ARCH: NO
        # Only NGTableICU's own Swift symbols are exported: the ICU inside
        # stays private to the framework.
        EXPORTED_SYMBOLS_FILE: exported-symbols.txt
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
