# The iPad apps: the demo and the bench, as an Xcode project that uses this
# package. Made with XcodeGen (`xcodegen` in this folder) from this file.
name: iPadDemos
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  NGTable:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  NGTable iPad:
    type: application
    platform: iOS
    sources: [iPadTable]
    dependencies:
      - package: NGTable
        product: NGTable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngtable.ipad-demo
        INFOPLIST_KEY_CFBundleDisplayName: NGTable iPad
  NGTable iPad Bench:
    type: application
    platform: iOS
    sources: [iPadBench]
    dependencies:
      - package: NGTable
        product: NGTable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngtable.ipad-bench
        INFOPLIST_KEY_CFBundleDisplayName: Table Bench
schemes:
  NGTable iPad:
    build:
      targets:
        NGTable iPad: all
    run:
      config: Debug
  NGTable iPad Bench:
    build:
      targets:
        NGTable iPad Bench: all
    run:
      # Frames are compared in an optimized build.
      config: Release
