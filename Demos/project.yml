# NGTable's apps: the iPad demo and bench, the Mac bench (live data, a
# campaigns table, a network feed, Binance), the engine comparison and the log
# viewer, as an Xcode project that uses this package; NGTable.xcworkspace at
# the repository's root opens it with the package. Made with XcodeGen
# (`xcodegen` in this folder) from this file. The comparison and the log
# viewer are packages too (`swift run`), with the same sources.
name: NGTableDemos
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  NGTable:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  NGTable iPad:
    type: application
    platform: iOS
    sources: [iPadTable]
    dependencies:
      - package: NGTable
        product: NGTable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngtable.ipad-demo
        INFOPLIST_KEY_CFBundleDisplayName: NGTable iPad
  NGTable iPad Bench:
    type: application
    platform: iOS
    sources: [iPadBench]
    dependencies:
      - package: NGTable
        product: NGTable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngtable.ipad-bench
        INFOPLIST_KEY_CFBundleDisplayName: Table Bench
  NGTable Mac Bench:
    type: application
    platform: macOS
    sources: [MacBench]
    dependencies:
      - package: NGTable
        product: NGTable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngtable.mac-bench
        INFOPLIST_KEY_CFBundleDisplayName: NGTable Mac Bench
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        TARGETED_DEVICE_FAMILY: ""
        # Like the app the benches came from: main actor by default.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
  NGTable Mac Bench Tests:
    type: bundle.unit-test
    platform: macOS
    sources: [MacBenchTests]
    dependencies:
      - target: NGTable Mac Bench
    settings:
      base:
        TARGETED_DEVICE_FAMILY: ""
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NGTable Mac Bench.app/Contents/MacOS/NGTable Mac Bench"
        BUNDLE_LOADER: "$(TEST_HOST)"
  NGTable Comparison:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [../Comparison/Sources/NGTableComparison]
    dependencies:
      - package: NGTable
        product: NGTable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngtable.comparison
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        TARGETED_DEVICE_FAMILY: ""
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  NGTable Log Viewer:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources: [LogViewer/Sources/NGTableLogViewer]
    dependencies:
      - package: NGTable
        product: NGTable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ngtable.log-viewer
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        TARGETED_DEVICE_FAMILY: ""
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
schemes:
  NGTable iPad:
    build:
      targets:
        NGTable iPad: all
    run:
      config: Debug
  NGTable iPad Bench:
    build:
      targets:
        NGTable iPad Bench: all
    run:
      # Frames are compared in an optimized build.
      config: Release
  NGTable Mac Bench:
    build:
      targets:
        NGTable Mac Bench: all
        NGTable Mac Bench Tests: [test]
    run:
      # Frames and the main thread's load are compared in an optimized build.
      config: Release
    test:
      config: Debug
      targets: [NGTable Mac Bench Tests]
  NGTable Comparison:
    build:
      targets:
        NGTable Comparison: all
    run:
      config: Release
  NGTable Log Viewer:
    build:
      targets:
        NGTable Log Viewer: all
    run:
      config: Release
